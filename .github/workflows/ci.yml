name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Blocks on critical only — see docs/DECISIONS.md §21 for the currently-accepted high/moderate
      # findings (both in build-time-only tooling, not runtime/production code) and their review date.
      - run: pnpm audit --audit-level=critical
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      # Guardrail for docs/DECISIONS.md §29's blog fetch-failure policy: a production build must
      # fail outright if it can't get real Sanity data, never silently render an empty/placeholder
      # blog state. Runs its own real `astro build` internally (VERCEL_ENV=production, no Sanity
      # config) and asserts it fails with the expected error — was previously only verified manually.
      - run: pnpm test:blog-production-guardrail

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  studio:
    name: studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Blocks on critical only — see docs/DECISIONS.md §21 for the currently-accepted high/moderate
      # findings (both in build-time-only tooling, not runtime/production code) and their review date.
      - run: pnpm audit --audit-level=critical
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Just Math Malaysia mark, standalone: a square-root sign whose lowest point is cut away in a circle,
  with the ochre dot in the cut. Same geometry as src/components/LogoLockup.astro, with colours
  hardcoded to the ink-900 and ochre-500 token values, since a standalone file has no page
  stylesheet. Square 512x512 for Organization.logo (BaseLayout.astro JSON-LD). Mark only; the
  "Just Math / MALAYSIA" wordmark in the header is CSS-styled text, not part of this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 124 124" width="512" height="512" role="img">
	<title>Just Math Malaysia mark</title>
	<defs>
		<mask id="cut" maskUnits="userSpaceOnUse" x="0" y="-12" width="124" height="124">
			<rect x="0" y="-12" width="124" height="124" fill="#fff"/>
			<circle cx="40" cy="92" r="13.5" fill="#000"/>
		</mask>
	</defs>
	<g mask="url(#cut)" fill="none" stroke="#14161a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
		<path d="M6 55 L22 46 L40 92"/>
		<path d="M40 92 L62 8 L118 8"/>
	</g>
	<circle cx="40" cy="92" r="7.5" fill="#b47b22"/>
</svg>

<script type="text/babel">
const { Field, Input, Select, Checkbox, RadioGroup } = window.JustMathDesignSystem_270e96;
function Demo(){

  return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:22}}>

      <Field label="Your child's name and form" hint="e.g. Nurul, Form 3"><Input placeholder="Nurul, Form 3" /></Field>

    <div style={{display:"grid",gap:16}}>
      <Field label="When suits you?"><RadioGroup name="slot" value={slot} onChange={setSlot} options={[{value:"wk",label:"Weekday evening",note:"After 8pm"},{value:"we",label:"Weekend morning"}]} /></Field>
      <Field label="Anything I should know?"><Input multiline rows={3} placeholder="She finds algebra hard but likes geometry." /></Field>
      <Checkbox defaultChecked label="Send the monthly progress report" description="One page, plain language." />
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);

<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="What to reach for instead of raw ramp values" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper)}table{width:100%;border-collapse:collapse;font:var(--type-small)}td{padding:6px 0;border-bottom:1px solid var(--rule);vertical-align:middle}td.k{font-family:var(--font-mono);font-size:12px;color:var(--ink-900);width:34%}td.v{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);width:26%}.dot{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid var(--rule);vertical-align:-3px;margin-right:8px}</style></head>
<body><table>
<tr><td class="k"><span class="dot" style="background:var(--text-strong)"></span>--text-strong</td><td class="v">ink-900</td><td>Headings, wordmark, figures</td></tr>
<tr><td class="k"><span class="dot" style="background:var(--text-body)"></span>--text-body</td><td class="v">ink-700</td><td>Running text</td></tr>
<tr><td class="k"><span class="dot" style="background:var(--text-muted)"></span>--text-muted</td><td class="v">ink-500</td><td>Leads, captions, hints</td></tr>
<tr><td class="k"><span class="dot" style="background:var(--surface-sunken)"></span>--surface-sunken</td><td class="v">paper-2</td><td>Alternating sections, quiet cards</td></tr>
<tr><td class="k"><span class="dot" style="background:var(--text-link)"></span>--text-link</td><td class="v">slate-600</td><td>Links, focus ring</td></tr>
</table></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Slate and ochre accents" subtitle="Slate for links and calm emphasis; ochre-600 sets text, ochre-500 draws rules only" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper)}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.s{height:56px;border-radius:var(--radius-sm)}.n{font:var(--type-small);font-size:12px;color:var(--text-muted);margin-top:8px;display:block}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style></head>
<body><div class="g">
<div><div class="s" style="background:var(--slate-700)"></div><span class="n">slate-700<br><span class="v">#1d3050</span></span></div>
<div><div class="s" style="background:var(--slate-600)"></div><span class="n">slate-600<br><span class="v">#2b4468</span></span></div>
<div><div class="s" style="background:var(--slate-500)"></div><span class="n">slate-500<br><span class="v">#3d5c86</span></span></div>
<div><div class="s" style="background:var(--slate-100)"></div><span class="n">slate-100<br><span class="v">#e7ecf3</span></span></div>
<div><div class="s" style="background:var(--ochre-600)"></div><span class="n">ochre-600 · text<br><span class="v">#8f6114</span></span></div>
<div><div class="s" style="background:var(--ochre-500)"></div><span class="n">ochre-500 · non-text<br><span class="v">#b47b22</span></span></div>
<div><div class="s" style="background:var(--ochre-100)"></div><span class="n">ochre-100<br><span class="v">#f6eedd</span></span></div>
</div></body></html>

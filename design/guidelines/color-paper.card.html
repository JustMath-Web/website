<!-- @dsCard group="Colors" viewport="700x150" name="Paper and rules" subtitle="Warm off-white grounds; hairlines do the dividing, not shadows" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--white)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.s{height:56px;border-radius:var(--radius-sm);border:1px solid var(--rule)}.n{font:var(--type-small);font-size:12px;color:var(--text-muted);margin-top:8px;display:block}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style></head>
<body><div class="g">
<div><div class="s" style="background:var(--white)"></div><span class="n">white<br><span class="v">#ffffff</span></span></div>
<div><div class="s" style="background:var(--paper)"></div><span class="n">paper<br><span class="v">#fbfaf7</span></span></div>
<div><div class="s" style="background:var(--paper-2)"></div><span class="n">paper-2<br><span class="v">#f3f0e9</span></span></div>
<div><div class="s" style="background:var(--paper-3)"></div><span class="n">paper-3<br><span class="v">#ebe7dd</span></span></div>
<div><div class="s" style="background:var(--rule)"></div><span class="n">rule<br><span class="v">#e3dfd6</span></span></div>
<div><div class="s" style="background:var(--rule-strong)"></div><span class="n">rule-strong<br><span class="v">#cfc9bc</span></span></div>
</div></body></html>

<!-- @dsCard group="Brand" viewport="700x150" name="Iconography" subtitle="Lucide at 1.5px stroke, ink only — plus the one WhatsApp glyph" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script><style>body{margin:0;padding:24px;background:var(--paper);display:flex;gap:26px;align-items:flex-end}.n{text-align:center}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:block;margin-top:10px}svg{color:var(--ink-900)}</style></head>
<body>
<div class="n"><i data-lucide="calendar" width="26" height="26"></i><span class="k">calendar</span></div>
<div class="n"><i data-lucide="clock" width="26" height="26"></i><span class="k">clock</span></div>
<div class="n"><i data-lucide="file-text" width="26" height="26"></i><span class="k">file-text</span></div>
<div class="n"><i data-lucide="check" width="26" height="26"></i><span class="k">check</span></div>
<div class="n"><i data-lucide="arrow-right" width="26" height="26"></i><span class="k">arrow-right</span></div>
<div class="n"><img src="../assets/icons/whatsapp.svg" width="26" height="26" alt=""><span class="k">whatsapp</span></div>
<p style="font:var(--type-small);color:var(--text-muted);max-width:24ch;margin:0 0 4px">Icons are rare and functional. Never decorative, never coloured, never inside a circle.</p>
<script>lucide.createIcons({attrs:{"stroke-width":1.5}})</script>
</body></html>

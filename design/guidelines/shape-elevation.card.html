<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Hairlines first; shadow only when something is clickable or floating" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--paper);display:flex;gap:22px;align-items:center}.b{width:140px;height:80px;background:var(--white);border:1px solid var(--rule);border-radius:var(--radius-lg)}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:block;margin-top:10px}</style></head>
<body>
<div><div class="b" style="box-shadow:var(--shadow-0)"></div><span class="k">shadow-0 · default</span></div>
<div><div class="b" style="box-shadow:var(--shadow-1)"></div><span class="k">shadow-1 · resting card</span></div>
<div><div class="b" style="box-shadow:var(--shadow-2)"></div><span class="k">shadow-2 · sticky header</span></div>
<div><div class="b" style="box-shadow:var(--shadow-lift)"></div><span class="k">shadow-lift · hover</span></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:22px;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;gap:28px}.ok{border-top:3px solid var(--ink-900);padding-top:14px}.no{border-top:1px solid var(--rule);padding-top:14px;opacity:.65}.t{font:var(--type-label);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}</style></head>
<body>
<div class="ok"><div class="t">Do</div><div style="font:var(--weight-semibold) 29px/1.2 var(--font-serif);color:var(--ink-900)">Fees</div><p style="font:var(--type-small);color:var(--text-muted);margin:8px 0 0">RM90 an hour, paid after each lesson.</p></div>
<div class="no"><div class="t">Don't</div><div style="font:600 29px/1.2 var(--font-sans);color:var(--ink-900)">Fees</div><p style="font:var(--type-small);font-family:var(--font-serif);color:var(--text-muted);margin:8px 0 0">RM90 an hour, paid after each lesson.</p></div>
</body></html>

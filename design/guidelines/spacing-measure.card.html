<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);display:grid;gap:14px}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:block;margin-bottom:4px}.bar{height:10px;background:var(--paper-3);border-radius:2px}.fill{height:10px;background:var(--ink-900);border-radius:2px}</style></head>
<body>
<div><span class="k">--page-max 1120px · landing container</span><div class="bar"><div class="fill" style="width:100%"></div></div></div>
<div><span class="k">--doc-max 720px · progress report column</span><div class="bar"><div class="fill" style="width:64%"></div></div></div>
<div><span class="k">--measure 64ch · body copy</span><div class="bar"><div class="fill" style="width:52%"></div></div></div>
<div><span class="k">--measure-narrow 46ch · leads and report notes</span><div class="bar"><div class="fill" style="width:37%"></div></div></div>
</body></html>

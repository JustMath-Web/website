<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--paper);display:flex;gap:34px;align-items:center}.box{position:relative;padding:21px;border:1px dashed var(--rule-strong);display:inline-flex}.lock{display:inline-flex;align-items:center;gap:.6em;color:var(--ink-900);line-height:1}.type{display:inline-flex;flex-direction:column;align-items:stretch;gap:.45em}.jm{font:var(--weight-semibold) 1em/1 var(--font-serif);letter-spacing:-.02em}.my{font-family:var(--font-sans);font-weight:600;font-size:.6em;letter-spacing:.24em;opacity:.72}.k{font:var(--type-small);color:var(--text-muted);max-width:32ch}</style></head>
<body>
<div class="box"><span class="lock" style="font-size:20px"><svg viewBox="0 0 160 160" width="2.05em" height="2.05em" fill="currentColor" aria-hidden="true" style="display:block;flex:none"><rect x="22" y="40.5" width="44" height="7"/><rect x="40.5" y="22" width="7" height="44"/><rect x="94" y="40.5" width="44" height="7"/><rect x="22" y="112.5" width="44" height="7" transform="rotate(45 44 116)"/><rect x="22" y="112.5" width="44" height="7" transform="rotate(-45 44 116)"/><rect x="94" y="112.5" width="44" height="7"/><circle cx="116" cy="99" r="4.5"/><circle cx="116" cy="133" r="4.5"/></svg><span class="type"><span class="jm">Just Math</span><span class="my lockup-fill">MALAYSIA</span></span></span></div>
<p class="k">Clear space on every side = half the mark's height (here 21px against a 41px mark). Minimum lockup width 150px; below that use the mark alone. Never over an image, never in green, never in any colour but ink or paper.</p>
</body></html>

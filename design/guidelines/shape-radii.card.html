<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);display:flex;gap:20px;align-items:flex-end}.b{width:84px;height:64px;background:var(--white);border:1px solid var(--rule-strong)}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:block;margin-top:8px}</style></head>
<body>
<div><div class="b" style="border-radius:var(--radius-0)"></div><span class="k">0 · rules, tables</span></div>
<div><div class="b" style="border-radius:var(--radius-sm)"></div><span class="k">3 · badges, swatches</span></div>
<div><div class="b" style="border-radius:var(--radius-md)"></div><span class="k">5 · controls</span></div>
<div><div class="b" style="border-radius:var(--radius-lg)"></div><span class="k">6 · cards</span></div>
<div><div class="b" style="border-radius:var(--radius-pill);width:64px"></div><span class="k">pill · avatars only</span></div>
</body></html>
